name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write        # the coverage badge is stored on a branch of this repo
  pull-requests: write   # coverage comment on pull requests

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # No GPU on CI runners: skip the 2.6 GB of CUDA wheels.
      - run: uv sync --locked --no-group gpu
      - name: Lint (ruff)
        run: uv run --no-sync ruff check .
      - name: Types (mypy)
        run: uv run --no-sync mypy
      - name: Shell scripts (shellcheck)
        run: uv run --no-sync shellcheck dictate install.sh scripts/*.sh tests/*.sh
      - name: Unit tests (pytest)
        run: uv run --no-sync pytest --cov --cov-report=term-missing
      # Badge and PR comment generated from .coverage, without any external
      # service: the badge lives on the python-coverage-comment-action-data branch.
      - name: Coverage badge
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
