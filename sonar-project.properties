# SonarQube Cloud analysis, run by the CI (.github/workflows/ci.yml).
sonar.organization=vdebes
sonar.projectKey=vdebes_endophasie
sonar.sources=.
sonar.exclusions=.venv/**,tests/**,docs/**
sonar.tests=tests
sonar.python.version=3.12
# Cobertura XML written by `pytest --cov --cov-report=xml`.
sonar.python.coverage.reportPaths=coverage.xml
