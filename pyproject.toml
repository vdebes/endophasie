[project]
name = "endophasie"
version = "0.1.0"
description = "100% local voice dictation for Linux. Whisper runs on your own GPU — your voice never leaves your machine."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.26.0.51",
]
